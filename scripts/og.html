<!doctype html>
<!--
  Картинка для превью ссылки (og:image), 1200×630. Рисует scripts/og.mjs в public/og.jpg.
  Тот же первый экран, что на сайте: логотип, заголовок из H1 и край сцены с готовым черновиком.
  Шрифты и картинки — файлы проекта, без сети
-->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Display';
        src: url('../src/fonts/rs-cyrillic.woff2') format('woff2');
        font-weight: 300 600;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'Display';
        src: url('../src/fonts/rs-latin.woff2') format('woff2');
        font-weight: 300 600;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+20BD, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Onest';
        src: url('../node_modules/@fontsource-variable/onest/files/onest-cyrillic-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'Onest';
        src: url('../node_modules/@fontsource-variable/onest/files/onest-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+20BD, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fff;
        color: #2b2a29;
        font-family: 'Onest', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .top {
        position: absolute;
        left: 64px;
        right: 64px;
        top: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .tag {
        font-size: 22px;
        color: #5f5d5a;
      }
      h1 {
        position: absolute;
        left: 0;
        right: 0;
        top: 124px;
        text-align: center;
        font-family: 'Display', serif;
        font-weight: 400;
        font-size: 96px;
        line-height: 1;
        letter-spacing: -0.012em;
        white-space: nowrap;
      }
      h1 span {
        display: block;
      }
      .accent {
        display: inline !important;
        background: linear-gradient(95deg, #3b2a22 0%, #9a3412 38%, #d9531e 70%, #e8772f 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Край сцены: тёмная карточка с размытым фото ниши и браузером с черновиком, уходит за нижний край */
      .stage {
        position: absolute;
        left: 64px;
        right: 64px;
        top: 382px;
        height: 320px;
        overflow: hidden;
        border-radius: 24px;
        background: #262524;
      }
      .ambient {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.1);
        filter: brightness(0.55) saturate(1.25);
      }
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(100deg, rgba(20, 19, 18, 0.72) 0%, rgba(20, 19, 18, 0.35) 40%, rgba(20, 19, 18, 0.1) 100%);
      }
      .name {
        position: absolute;
        left: 44px;
        top: 50px;
        color: #fff;
      }
      .name small {
        display: block;
        font-size: 18px;
        color: rgba(255, 255, 255, 0.6);
      }
      .name b {
        display: block;
        margin-top: 10px;
        font-family: 'Display', serif;
        font-weight: 400;
        font-size: 60px;
        line-height: 1;
        letter-spacing: -0.012em;
      }
      .browser {
        position: absolute;
        left: 352px;
        right: 40px;
        top: 40px;
        overflow: hidden;
        border-radius: 14px;
        background: #1d1d1f;
        box-shadow:
          0 40px 90px -30px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .bar {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 36px;
        padding: 0 14px;
      }
      .dots {
        display: flex;
        gap: 6px;
      }
      .dots i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }
      .url {
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 46%;
        height: 22px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
      }
      .browser img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="logo">
        <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25Z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" />
          <path d="M10.4 21.5V10.8h2.5l3.1 5.2 3.1-5.2h2.5v10.7h-2.6v-6.2l-2.9 4.8h-.3l-2.9-4.8v6.2Z" fill="currentColor" />
        </svg>
        МирВеб
      </div>
      <div class="tag">Лендинги для малого бизнеса</div>
    </div>

    <h1>
      <span>Сайт для бизнеса</span>
      <span><span class="accent">за 5 дней,</span> от 30 000 ₽</span>
    </h1>

    <div class="stage">
      <img class="ambient" src="../public/video/niche/auto-blur.webp" alt="" />
      <div class="shade"></div>
      <div class="name">
        <small>Детейлинг</small>
        <b>«Глянец»</b>
      </div>
      <div class="browser">
        <div class="bar">
          <div class="dots"><i style="background: #ff5f57"></i><i style="background: #febc2e"></i><i style="background: #28c840"></i></div>
          <div class="url">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2.5" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
            glyanets.ru
          </div>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></svg>
        </div>
        <img src="../public/img/draft-desktop.webp" alt="" />
      </div>
    </div>
  </body>
</html>
